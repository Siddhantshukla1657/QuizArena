services:
  - type: web
    name: quizarena
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/quiz.db
    disk:
      name: quizarena-db
      mountPath: /var/data
      sizeGB: 1
